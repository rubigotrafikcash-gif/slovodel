[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slovodel-core"
version = "0.1.0"
description = "Offline, deterministic report scaffold for the public Slovodel skill"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TairPromo contributors"}]
dependencies = []

[tool.setuptools]
package-dir = {"" = "skills/slovodel"}
packages = ["slovodel_core"]
