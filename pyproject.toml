[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "slovodel-core"
version = "0.8.0"
description = "Offline diagnostics for creating and improving texts in Russian"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "TairPromo contributors"}]
dependencies = []

[project.optional-dependencies]
morphology = ["pymorphy3==2.0.6", "pymorphy3-dicts-ru==2.4.417150.4580142"]

[tool.setuptools]
package-dir = {"" = "skills/slovodel"}
packages = ["slovodel_core"]
