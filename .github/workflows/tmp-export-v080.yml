name: Export published v0.8.0 skill ZIP for user install
on:
  push:
    branches:
      - tmp-export-v080-for-install
    paths:
      - .github/workflows/tmp-export-v080.yml
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify exact public release archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v0.8.0 --repo rubigotrafikcash-gif/slovodel --pattern slovodel-v0.8.0.zip
          echo "50357b7163f7bff557755ebd48fe9f7ab038721a74a8456f769ffbba1389d1bb  slovodel-v0.8.0.zip" | sha256sum --check
          unzip -Z1 slovodel-v0.8.0.zip | grep -q '^slovodel/SKILL.md$'
      - uses: actions/upload-artifact@v4
        with:
          name: slovodel-v080-for-install
          path: slovodel-v0.8.0.zip
          retention-days: 1
          if-no-files-found: error
