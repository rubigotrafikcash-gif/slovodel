name: "Publish Slovodel v0.8.0 prerelease after verified main merge"

on:
  # Published 2026-10-16. Manual only, so later edits of docs/releases/v0.8.0.md
  # never re-run publication (note edits are synced by sync-release-notes.yml).
  # Re-running replaces the release asset and moves the tag to current main.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: slovodel-v0.8.0-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'rubigotrafikcash-gif/slovodel'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify v0.7 release commit and package independently
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          grep -q 'PRE-RELEASE' docs/releases/v0.8.0.md
          python scripts/release_smoke.py --output /tmp/slovodel-portable-release-check.json
          python scripts/benchmark_v08.py --output /tmp/slovodel-v08-benchmark.json
          python scripts/benchmark_v07.py --output /tmp/slovodel-v07-benchmark.json
          python scripts/offline_smoke.py
          python -m unittest discover -s tests -q
      - name: Prepare zip with only the single portable skill directory
        run: |
          set -euo pipefail
          mkdir -p dist/bundle
          cp -R skills/slovodel dist/bundle/slovodel
          find dist/bundle -type d -name __pycache__ -prune -exec rm -rf {} +
          find dist/bundle -type f -name '*.pyc' -delete
          cd dist/bundle
          zip -q -r ../slovodel-v0.8.0.zip slovodel
          test -s ../slovodel-v0.8.0.zip
      - name: Replace v0.8.0 asset and move tag to current main (owner-approved 2026-10-16)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.8.0"
          # The release must already exist; it is never deleted, so there is no gap.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null
          old="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          echo "Previous tag target: $old"
          gh release upload "$tag" "dist/slovodel-v0.8.0.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
            -f sha="$GITHUB_SHA" -F force=true >/dev/null
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha')"
          test "$actual" = "$GITHUB_SHA"
          mkdir -p /tmp/verify
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            -p 'slovodel-v0.8.0.zip' -D /tmp/verify --clobber
          cmp /tmp/verify/slovodel-v0.8.0.zip dist/slovodel-v0.8.0.zip
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName,isPrerelease,url
