name: "Slovodel public quality gates: tests schemas coverage offline"
on:
  pull_request:
    paths:
      - "skills/slovodel/scripts/**"
      - "skills/slovodel/slovodel_core/**"
      - "schemas/**"
      - "tests/test_cli.py"
      - "tests/test_metrics.py"
      - "tests/test_a2.py"
      - "tests/test_morphology.py"
      - "tests/test_fact_guard.py"
      - "tests/test_workflow.py"
      - "tests/test_quality_regressions.py"
      - "tests/test_offline_policy.py"
      - "tests/test_agent_eval_manifest.py"
      - "tests/fixtures/**"
      - "scripts/**"
      - "skills/slovodel/schemas/**"
      - "skills/slovodel/LICENSE"
      - "skills/slovodel/references/install.md"
      - ".coveragerc"
      - "skills/slovodel/SKILL.md"
      - "skills/slovodel/references/cli-contract.md"
      - "skills/slovodel/references/metrics-contract.md"
      - "skills/slovodel/references/a2-contract.md"
      - "skills/slovodel/references/morphology-contract.md"
      - "skills/slovodel/references/fact-guard-contract.md"
      - "skills/slovodel/references/agent-workflow.md"
      - "skills/slovodel/references/formats.md"
      - "skills/slovodel/references/workflows.md"
      - "skills/slovodel/references/examples.md"
      - "evals/cases.md"
      - "skills/slovodel/references/morphology-licenses.md"
      - "skills/slovodel/references/corpus-license-review.md"
      - "skills/slovodel/resources/corpora/README.md"
      - "README.md"
      - "pyproject.toml"
      - "docs/ISSUE_4_VERIFICATION.md"
      - "docs/ISSUE_5_VERIFICATION.md"
      - "docs/ISSUE_6_VERIFICATION.md"
      - "docs/ISSUE_7_VERIFICATION.md"
      - "docs/ISSUE_8_VERIFICATION.md"
      - "docs/ISSUE_9_VERIFICATION.md"
      - "docs/ISSUE_10_VERIFICATION.md"
      - "docs/releases/**"
      - ".github/workflows/release-v0.6.0.yml"
      - "evals/agent-test-protocol.md"
      - "evals/agent-runs/**"
      - "docs/ISSUE_3_VERIFICATION.md"
      - ".github/workflows/issue-3-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cli-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Four-mode CLI smoke
        run: python skills/slovodel/scripts/workflow.py --help
      - name: Fact guard CLI smoke
        run: python skills/slovodel/scripts/validate.py --help
      - name: Run offline standard-library tests
        run: python -m unittest discover -s tests -v
      - name: Validate reports against full JSON Schema Draft 2020-12
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.25.1
          python -m unittest discover -s tests -v
      - name: Install optional, pinned morphology backend (CI only)
        run: |
          python -m pip install --disable-pip-version-check pymorphy3==2.0.6 pymorphy3-dicts-ru==2.4.417150.4580142
          python -m unittest discover -s tests -v
      - name: Coverage of deterministic linguistic kernel (minimum 90 percent)
        run: |
          python -m pip install --disable-pip-version-check coverage==7.10.7
          mkdir -p test-results
          python -m coverage run --source=skills/slovodel/slovodel_core -m unittest discover -s tests -q
          python -m coverage report --include="*/slovodel_core/metrics.py,*/slovodel_core/a2.py,*/slovodel_core/fact_guard.py,*/slovodel_core/reports.py,*/slovodel_core/workflow.py" --show-missing --fail-under=90
          python -m coverage json --include="*/slovodel_core/metrics.py,*/slovodel_core/a2.py,*/slovodel_core/fact_guard.py,*/slovodel_core/reports.py,*/slovodel_core/workflow.py" -o test-results/coverage.json
      - name: Save machine-readable unit/regression results
        run: python scripts/quality_report.py --output test-results/unittest-results.json
      - name: Isolated installed skill smoke (Codex/Claude folder layouts, no agent auth)
        run: python scripts/release_smoke.py --output test-results/portable-install.json
      - name: No-network smoke (socket functions disabled, synthetic texts)
        run: python scripts/offline_smoke.py
      - name: Ensure no network module use in runtime core
        run: |
          python - <<'PY'
          from pathlib import Path
          import ast
          roots = [Path("skills/slovodel/slovodel_core"), Path("skills/slovodel/scripts")]
          forbidden = {"socket", "urllib", "requests", "http", "ftplib", "smtplib", "aiohttp"}
          for root in roots:
              for path in root.glob("*.py"):
                  tree = ast.parse(path.read_text(encoding="utf-8"))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          names = [alias.name for alias in node.names]
                      elif isinstance(node, ast.ImportFrom):
                          names = [node.module or ""]
                      else:
                          continue
                      assert not (forbidden & {name.split(".")[0] for name in names}), path
          PY

      - name: Upload machine-readable coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-python-${{ matrix.python-version }}
          path: |
            test-results/coverage.json
            test-results/unittest-results.json
            test-results/portable-install.json
          if-no-files-found: warn
          retention-days: 30
